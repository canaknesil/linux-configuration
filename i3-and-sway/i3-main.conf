# i3 config file (v4)

set $LINUX_CONFIGURATION_DIR ~/Programs/linux-configuration

# Uncomment one
# set $I3SWAY i3
# set $I3SWAY sway

set $FONT pango:DejaVu Sans Mono 10

# set $TERMINAL i3-sensible-terminal # X11
# set $TERMINAL xfce4-terminal # X11
# set $TERMINAL ghostty # Wayland-compatible
set $TERMINAL true

# set $DROP_DOWN_TERMINAL xfce4-terminal --drop-down # X11
# TODO: Drop-down terminal for Wayland
set $DROP_DOWN_TERMINAL true

# set $COMMAND_LAUNCHER dmenu_run # X11
# set $COMMAND_LAUNCHER wmenu-run # Wayland
set $COMMAND_LAUNCHER true

# set $DESKTOP_LAUNCHER "rofi -modi drun,run -show drun -show-icons"
set $DESKTOP_LAUNCHER true

# Some wallpaper commands for X11
# feh --bg-max <path>
# nitrogen --restore

# set $DISPLAY_AND_WALLPAPER_CONFIG_COMMAND nitrogen --restore
# set $DISPLAY_AND_WALLPAPER_CONFIG_COMMAND /bin/sh -c 'autorandr --change; sleep 0.5; nitrogen --restore'
# Note that wallpaper configuration can also be hooked to autorandr

# TODO: Display configuration for Wayland. Wallpaper setup is directly handled by sway
set $DISPLAY_AND_WALLPAPER_CONFIG_COMMAND true

# set $LOCK_COMMAND i3lock --show-keyboard-layout --nofork # X11

# The --image spans through multiple monitors. --tiling enables repeating the image in the second screen.
# Image must be an absolute path to a .png file
# set $LOCK_COMMAND i3lock --show-keyboard-layout --nofork --image=<WALLPAPER_FILE> --tiling # X11

# set $LOCK_COMMAND xfce4-screensaver-command --lock # X11

# set $LOCK_COMMAND swaylock -f --image <WALLPAPER_FILE> --scaling fill # Wayland
set $LOCK_COMMAND true

# 'xset -dpms' disables DPMS (screen blanking) timeouts.
# 'xset dpms force off' triggers DPMS.
# 'xset s TIMEOUT CYCLE' configures the X11 ScreenSaver extension.
#
# After TIMEOUT seconds of inactivity, the ScreenSaver activates.
# CYCLE specifies how often ScreenSaver cycle events are generated
# while the ScreenSaver is active.
#
# xss-lock repurposes these events:
#   - without --notifier, it starts the locker when the ScreenSaver
#     activates (after TIMEOUT);
#   - with --notifier, it runs the notifier when the ScreenSaver
#     activates and starts the locker on the first cycle event
#     (TIMEOUT + CYCLE).
#
# --transfer-sleep-lock also starts the locker before the system
# suspends.

# Note that xfce4 handles this internally.
# set $SCREENSAVER_SETUP_COMMAND /bin/sh -c 'xset -dpms; xset s 600 10; xss-lock --transfer-sleep-lock --notifier "xset dpms force off" -- $LOCK_COMMAND' # X11
# set $SCREENSAVER_SETUP_COMMAND /bin/sh -c 'xset s off; xset -dpms; xfce4-screensaver' # X11
# set $SCREENSAVER_SETUP_COMMAND swayidle -w timeout 600 'swaymsg "output * dpms off"' resume 'swaymsg "output * dpms on"' timeout 610 $LOCK_COMMAND before-sleep $LOCK_COMMAND # Wayland
set $SCREENSAVER_SETUP_COMMAND true
set $LOCK_BEFORE_SUSPEND_SETUP_COMMAND true

# set $POWER_MANAGER xfce4-power-manager # X11, handles screen brightness and its bindings, power button and lid behavior, power profiles, auto-blanking, auto-suspending, auto-locking.
# Waybar handles power profiles for Wayland.
set $POWER_MANAGER true

# set $COMPOSITOR picom # Only required on X11
set $COMPOSITOR true

# set $NETWORK_MANAGER_APPLET nm-applet
set $NETWORK_MANAGER_APPLET true

# set $BLUETOOTH_APPLET blueman-applet
set $BLUETOOTH_APPLET true

# set $AUDIO_APPLET pasystray # runs automatically
# set $AUDIO_APPLET xfce4-volumed-pulse # X11
# TODO: Audio applet for Wayland
set $AUDIO_APPLET true

# TODO: Screenshot on X11
# set $SCREENSHOT grim # Wayland
set $SCREENSHOT true

set $ADDITIONAL_STARTUP_COMMANDS true

# Special keys to adjust brightness. Comment them to delegate the
# functionality to another program, e.g., xfce4 power manager.
# bindsym XF86MonBrightnessUp exec brightnessctl set 5%+
# bindsym XF86MonBrightnessDown exec brightnessctl set 5%-

# Mod1: alt key
# Mod4: windows key
set $mod Mod4
set $alt Mod1

# Uncomment if using Sway
# include $LINUX_CONFIGURATION_DIR/sway-only.conf
# Uncomment if using i3
# include $LINUX_CONFIGURATION_DIR/i3-only.conf

include $LINUX_CONFIGURATION_DIR/i3.conf
