# i3 config file (v4)

# Based on /etc/i3/config that comes with version 4.23. Tested with i3 version 4.23.

# Necessary additional packages:
# i3status
# dex: desktop opener, used for opening applicatinos at startup
# playerctl

#
# FONT
#

# Font for window titles. Will also be used by the bar unless a different font
# is used in the bar {} block below.
font $FONT


#
# EXEC
#

exec --no-startup-id $COMPOSITOR
exec --no-startup-id $DISPLAY_AND_WALLPAPER_CONFIG_COMMAND
exec --no-startup-id $LOCK_BEFORE_SUSPEND_SETUP_COMMAND
exec --no-startup-id $SCREENSAVER_SETUP_COMMAND
exec --no-startup-id $NETWORK_MANAGER_APPLET
exec --no-startup-id $BLUETOOTH_APPLET
exec --no-startup-id $AUDIO_APPLET
exec --no-startup-id $POWER_MANAGER
exec --no-startup-id $ADDITIONAL_STARTUP_COMMANDS

exec --no-startup-id dex --autostart --environment $I3SWAY


#
# KEY BINDINGS
#

# Use pactl to adjust volume in PulseAudio.
set $refresh_i3status killall -SIGUSR1 i3status
#bindsym --locked XF86AudioRaiseVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ +10% && $refresh_i3status
#bindsym --locked XF86AudioLowerVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ -10% && $refresh_i3status
#bindsym --locked XF86AudioMute exec --no-startup-id pactl set-sink-mute @DEFAULT_SINK@ toggle && $refresh_i3status
#bindsym --locked XF86AudioMicMute exec --no-startup-id pactl set-source-mute @DEFAULT_SOURCE@ toggle && $refresh_i3status
bindsym XF86AudioRaiseVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ +10% && $refresh_i3status
bindsym XF86AudioLowerVolume exec --no-startup-id pactl set-sink-volume @DEFAULT_SINK@ -10% && $refresh_i3status
bindsym XF86AudioMute exec --no-startup-id pactl set-sink-mute @DEFAULT_SINK@ toggle && $refresh_i3status
bindsym XF86AudioMicMute exec --no-startup-id pactl set-source-mute @DEFAULT_SOURCE@ toggle && $refresh_i3status

# Special keys to control media via playerctl
#bindsym --locked XF86AudioPlay exec playerctl play-pause
#bindsym --locked XF86AudioPause exec playerctl play-pause
#bindsym --locked XF86AudioPrev exec playerctl previous
#bindsym --locked XF86AudioNext exec playerctl next
#bindsym --locked XF86AudioStop exec playerctl stop
bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioPause exec playerctl play-pause
bindsym XF86AudioPrev exec playerctl previous
bindsym XF86AudioNext exec playerctl next
bindsym XF86AudioStop exec playerctl stop

# Special keys to adjust brightness
#bindsym --locked XF86MonBrightnessUp exec $BRIGHTNESS_INC
#bindsym --locked XF86MonBrightnessDown exec $BRIGHTNESS_DEC
bindsym XF86MonBrightnessUp exec $BRIGHTNESS_INC
bindsym XF86MonBrightnessDown exec $BRIGHTNESS_DEC

# use these keys for focus, movement, and resize directions when reaching for
# the arrows is not convenient
# set $up l
# set $down k
# set $left j
# set $right semicolon
set $up i
set $down k
set $left j
set $right l

# start a terminal
bindsym $mod+Return exec $TERMINAL

# drop down terminal
bindsym $mod+BackSpace exec $DROP_DOWN_TERMINAL

# kill focused window
bindsym $mod+Shift+q kill

# start program launcher, e.g. dmenu
bindsym $mod+d exec --no-startup-id $COMMAND_LAUNCHER
# start desktop program launcher
bindsym $mod+space exec $DESKTOP_LAUNCHER

# change focus
bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right

# alternatively, you can use the cursor keys:
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# move focused window
bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right

# alternatively, you can use the cursor keys:
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# enter fullscreen mode for the focused container
bindsym $mod+f fullscreen toggle

# change container layout (stacked, tabbed, toggle split)
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split

# toggle tiling / floating
bindsym $mod+Shift+space floating toggle

# change focus between tiling / floating windows
#bindsym $mod+space focus mode_toggle # maping mod+space to application launcher
bindsym $mod+Shift+f focus mode_toggle

# focus the parent container
bindsym $mod+a focus parent

# focus the child container
#bindsym $mod+d focus child
bindsym $mod+Shift+a focus child

# move the currently focused window to the scratchpad
bindsym $mod+Shift+minus move scratchpad

# Show the next scratchpad window or hide the focused scratchpad window.
# If there are multiple scratchpad windows, this command cycles through them.
bindsym $mod+minus scratchpad show

# Define names for default workspaces for which we configure key bindings later on.
# We use variables to avoid repeating the names in multiple places.
set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"
set $ws7 "7"
set $ws8 "8"
set $ws9 "9"
set $ws10 "10"

# switch to workspace
bindsym $mod+1 workspace number $ws1
bindsym $mod+2 workspace number $ws2
bindsym $mod+3 workspace number $ws3
bindsym $mod+4 workspace number $ws4
bindsym $mod+5 workspace number $ws5
bindsym $mod+6 workspace number $ws6
bindsym $mod+7 workspace number $ws7
bindsym $mod+8 workspace number $ws8
bindsym $mod+9 workspace number $ws9
bindsym $mod+0 workspace number $ws10

# move focused container to workspace
bindsym $mod+Shift+1 move container to workspace number $ws1
bindsym $mod+Shift+2 move container to workspace number $ws2
bindsym $mod+Shift+3 move container to workspace number $ws3
bindsym $mod+Shift+4 move container to workspace number $ws4
bindsym $mod+Shift+5 move container to workspace number $ws5
bindsym $mod+Shift+6 move container to workspace number $ws6
bindsym $mod+Shift+7 move container to workspace number $ws7
bindsym $mod+Shift+8 move container to workspace number $ws8
bindsym $mod+Shift+9 move container to workspace number $ws9
bindsym $mod+Shift+0 move container to workspace number $ws10

# move workspace to output
bindsym $mod+$alt+j move workspace to output left
bindsym $mod+$alt+l move workspace to output right

# lock screen
bindsym $mod+m exec $LOCK_COMMAND

# reload the configuration file
bindsym $mod+Shift+c reload
# restart i3 inplace (preserves your layout/session, can be used to upgrade i3)
bindsym $mod+Shift+r restart

# change keyboard layout
set $write_keyboard_layout setxkbmap -query | awk '/layout/ {print $2}' > /tmp/keyboard_layout_for_i3status
exec --no-startup-id $write_keyboard_layout
bindsym $mod+$alt+1 exec --no-startup-id setxkbmap us && $write_keyboard_layout && $refresh_i3status
bindsym $mod+$alt+2 exec --no-startup-id setxkbmap tr && $write_keyboard_layout && $refresh_i3status
bindsym $mod+$alt+3 exec --no-startup-id setxkbmap se && $write_keyboard_layout && $refresh_i3status

# resize window (you can also use the mouse for that)
mode "resize" {
  # These bindings trigger as soon as you enter the resize mode

  # Pressing left will shrink the window’s width.
  # Pressing right will grow the window’s width.
  # Pressing up will shrink the window’s height.
  # Pressing down will grow the window’s height.
  bindsym $left       resize shrink width 10 px or 10 ppt
  bindsym $down       resize grow height 10 px or 10 ppt
  bindsym $up         resize shrink height 10 px or 10 ppt
  bindsym $right      resize grow width 10 px or 10 ppt

  # same bindings, but for the arrow keys
  bindsym Left        resize shrink width 10 px or 10 ppt
  bindsym Down        resize grow height 10 px or 10 ppt
  bindsym Up          resize shrink height 10 px or 10 ppt
  bindsym Right       resize grow width 10 px or 10 ppt

  # back to normal: Enter or Escape or $mod+r
  bindsym Return mode "default"
  bindsym Escape mode "default"
  bindsym $mod+r mode "default"
}

bindsym $mod+r mode "resize"

